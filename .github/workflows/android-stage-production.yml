name: Android Stage Production Draft

# Stages an already-built AAB into the Production track as a DRAFT release
# (nothing is published or sent for review). Use this when the Console UI
# can't drive the release editor. Pick the release tag, e.g. android-152.

concurrency:
  group: android-stage-production-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag holding the .aab (e.g. android-152)'
        required: true

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download AAB + mapping from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern '*.aab' --pattern 'mapping-*.txt' --clobber
          ls -la *.aab mapping-*.txt

      - name: Stage as production draft
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.balkanbit.looxmaxxing
          releaseFiles: '*.aab'
          track: production
          status: draft
          mappingFile: mapping-*.txt
